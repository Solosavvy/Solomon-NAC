name: Android Release Build

on:
  push:
    branches:
      - feat/android-background-audio
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Android Platform Directory
        run: |
          if [ ! -d "android" ]; then
            echo "android/ folder missing. Adding Capacitor Android platform..."
            npx cap add android
          else
            echo "✓ android/ directory detected"
          fi

      - name: Install Capacitor Audio Plugin
        run: |
          chmod +x scripts/install-android-plugin.sh
          ./scripts/install-android-plugin.sh

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Debug Directory Inspection
        run: |
          echo "=== Root Directory ==="
          ls -la
          echo "=== Android Directory ==="
          if [ -d "android" ]; then
            ls -la android/
          else
            echo "android folder does not exist"
          fi

      - name: Execute Gradle assembleRelease
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            echo "Found ./gradlew wrapper, adjusting permissions..."
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "Gradle wrapper not found, using system gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleRelease --stacktrace
          fi

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nac-choir-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

# -------------------------------------------------------------------
# SIGNING SECRETS SETUP GUIDE FOR PRODUCTION RELEASE:
# To generate a signed APK / AAB for Google Play release:
# 1. Generate a keystore file:
#    keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias
# 2. Encode to Base64:
#    base64 -w 0 my-release-key.jks > keystore_base64.txt
# 3. Add GitHub Repository Secrets under Settings > Secrets and variables > Actions:
#    - SIGNING_KEYSTORE_BASE64 : [Content of keystore_base64.txt]
#    - KEYSTORE_PASSWORD       : [Your Keystore Password]
#    - KEY_ALIAS               : [Your Key Alias]
#    - KEY_PASSWORD            : [Your Key Password]
# 4. Decode in CI before assembleRelease:
#    echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/my-release-key.jks
# -------------------------------------------------------------------
